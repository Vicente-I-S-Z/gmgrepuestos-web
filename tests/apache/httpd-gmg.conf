# Apache de prueba para GMG Repuestos (XAMPP). Sirve el proyecto con sus .htaccess,
# como en Hostinger, para probar bloqueos, redirecciones y cabeceras.
# Solo escucha en 127.0.0.1:8080 (no queda visible en la red) y no toca la configuración de XAMPP.
# No se sube al hosting (tests/ queda fuera de public_html).
#
# Iniciar (desde la carpeta del proyecto, deja la ventana abierta):
#   C:\xampp\apache\bin\httpd.exe -f "%CD%\tests\apache\httpd-gmg.conf"
# Detener: Ctrl+C en esa ventana, o
#   taskkill /F /T /PID <número que está en C:\xampp\apache\logs\gmg-8080.pid>
# Si el proyecto está en otra carpeta, cambia GMG_RAIZ.

Define GMG_RAIZ "C:/Users/santi/Desktop/Gmgrepuestos"

ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8080
ServerName localhost:8080
PidFile "logs/gmg-8080.pid"
ErrorLog "logs/gmg-8080-error.log"
LogLevel warn

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule expires_module modules/mod_expires.so

# PHP de XAMPP (mismo php.ini que la consola)
LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
DirectoryIndex index.php index.html
LogFormat "%h %t \"%r\" %>s %b" corto
CustomLog "logs/gmg-8080-access.log" corto

DocumentRoot "${GMG_RAIZ}"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${GMG_RAIZ}">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
