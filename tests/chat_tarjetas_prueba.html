<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Prueba de tarjetas del chat</title>
</head>
<body style="margin:0">
<!--
  Página de prueba de tests/chat_tarjetas_test.php (F1-7). Carga la tienda real en un iframe con
  una conversación guardada en localStorage y revisa las tarjetas del chat. No se publica (tests/).
  ?captura=1: solo restaura la conversación y abre el chat, para sacar una captura de pantalla.
-->
<iframe id="sitio" title="Tienda" style="width:360px;height:740px;border:0;display:block"></iframe>
<pre id="resultado">pendiente</pre>
<script>
const nombreMalicioso = 'O\'Higgins "x" <img src=x onerror="window.top.__xss=1">';
const productos = [
    { id: 242, nombre: 'Pastillas de freno delanteras (juego) Swift 3a gen.', sku: 'FRE-SWI3-PDL', precio: '24990.00', stock: 5,
      disponibilidad: 'Disponible', imagen_url: 'img/placeholder-repuesto.svg', modelo: 'Swift', url_ficha: 'producto.php?id=242' },
    { id: 243, nombre: 'Balatas de freno traseras', sku: 'FRE-SWI3-BTR', precio: '19990.00', stock: 2,
      disponibilidad: 'Últimas unidades', imagen_url: 'img/no-existe-esta-foto.jpg', modelo: 'Swift', url_ficha: null },
    { id: 300, nombre: 'Disco de freno', sku: 'FRE-X', precio: '30000', stock: 0, disponibilidad: 'Sin stock', imagen_url: '', modelo: 'Swift' },
    { id: 301, nombre: 'Filtro guardado antes del cambio', sku: 'FIL-OLD', precio: 5000, stock: 0, imagen_url: '' },
    { id: 302, nombre: 'Producto sin datos de stock', sku: 'X-1', precio: 1000 },
    { id: '303" data-malo="1', nombre: nombreMalicioso, sku: '<b>SKU</b>', precio: '9990', stock: 5, disponibilidad: 'Disponible',
      imagen_url: 'img/a.jpg" onerror="window.top.__xss=2', modelo: 'Swift', url_ficha: 'javascript:window.top.__xss=3' },
];
localStorage.setItem('gmg_chat_historial', JSON.stringify([
    { rol: 'user', texto: 'pastillas swift 2019', productos: [], imagenes: [] },
    { rol: 'bot', texto: 'Tengo estas opciones', productos: productos, mensajeId: null },
]));

const esperar = ms => new Promise(r => setTimeout(r, ms));
const captura = location.search.includes('captura=1');
const iframe = document.getElementById('sitio');
const ancho = parseInt(new URLSearchParams(location.search).get('ancho'), 10);
if (ancho) { iframe.style.width = ancho + 'px'; iframe.style.height = '760px'; }

iframe.addEventListener('load', async () => {
    await esperar(800);
    const d = iframe.contentDocument;
    const w = iframe.contentWindow;
    if (captura) {
        d.getElementById('gmgChatToggle').click();
        await esperar(parseInt(new URLSearchParams(location.search).get('espera'), 10) || 500);
        const mensajes = d.getElementById('gmgChatMessages');
        mensajes.scrollTop = d.querySelector('.gmg-chat-products').offsetTop - mensajes.offsetTop - 10;
        document.getElementById('resultado').textContent = 'captura';
        return;
    }
    const r = {};
    const tarjetas = [...d.querySelectorAll('.gmg-chat-product-card')];
    r.tarjetas = tarjetas.length;
    r.disponibilidad = tarjetas.map(t => (t.querySelector('.gmg-disponibilidad') || {}).textContent || '');
    r.botones = tarjetas.map(t => { const b = t.querySelector('[data-accion="agregar"]'); return b.textContent.trim() + (b.disabled ? ' (deshabilitado)' : ''); });
    r.fichas = tarjetas.map(t => t.querySelector('.gmg-chat-btn-ficha')?.getAttribute('href') || '');
    r.codigoEnLinea = d.querySelectorAll('.gmg-chat-products [onclick], .gmg-chat-products [onerror], .gmg-chat-products [onload]').length;
    r.atributoInyectado = d.querySelectorAll('[data-malo]').length;
    r.nombreIntacto = tarjetas[5].querySelector('[data-accion="agregar"]').dataset.nombre === nombreMalicioso;
    r.fotoCambiada = tarjetas[1].querySelector('img').getAttribute('src');

    const llamadas = [];
    w.addToCartFromChat = (producto, cantidad) => llamadas.push({ producto, cantidad });
    tarjetas[0].querySelector('[data-accion="agregar"]').click();
    tarjetas[2].querySelector('[data-accion="agregar"]').click();
    tarjetas[5].querySelector('[data-accion="agregar"]').click();
    r.carrito = llamadas;

    // Mensaje nuevo con respuesta del servidor (fetch simulado): con movimiento reducido se ve completo de inmediato.
    const largo = 'Estas son tus opciones para el Swift 2019. '.repeat(6).trim();
    w.fetch = async () => new Response(JSON.stringify({ status: 'success', reply: largo, mensaje_id: 9, auto_add_cart: [],
        products: [{ id: 244, nombre: 'Pastillas nuevas', sku: 'FRE-NEW', precio: '15000.00', stock: 0, disponibilidad: 'Sin stock',
                     imagen_url: 'img/placeholder-repuesto.svg', modelo: 'Swift', url_ficha: 'producto.php?id=244' }] }),
        { headers: { 'Content-Type': 'application/json' } });
    d.getElementById('gmgChatInput').value = 'necesito pastillas';
    d.getElementById('gmgChatSend').click();
    await esperar(150);
    const burbujas = [...d.querySelectorAll('.gmg-msg-bot .gmg-msg-bubble')];
    const ultima = burbujas[burbujas.length - 1];
    r.textoCompletoAlInstante = ultima.textContent.includes(largo.slice(-40));
    r.reducirMovimiento = w.matchMedia('(prefers-reduced-motion: reduce)').matches;
    r.tarjetaNueva = (ultima.querySelector('[data-accion="agregar"]') || {}).disabled === true && !!ultima.querySelector('a.gmg-chat-btn-ficha[href="producto.php?id=244"]');

    // El servidor no responde: a los 30 s se corta la espera y se ofrece WhatsApp.
    w.fetch = (url, opciones) => new Promise((ok, falla) => opciones.signal.addEventListener('abort', () => falla(new DOMException('Cortado', 'AbortError'))));
    d.getElementById('gmgChatInput').value = 'hola';
    d.getElementById('gmgChatSend').click();
    await esperar(29000);
    const antes = [...d.querySelectorAll('.gmg-msg-bot .gmg-msg-bubble')].pop().textContent;
    await esperar(2000);
    const despues = [...d.querySelectorAll('.gmg-msg-bot .gmg-msg-bubble')].pop();
    r.esperaAntesDe30s = !antes.includes('tardando');
    r.avisoTrasEspera = despues.textContent.includes('tardando más de lo normal');
    r.enlaceWhatsApp = (despues.querySelector('a[href^="https://wa.me/"]') || {}).href || '';

    // Fotos adjuntas (F1-8): el navegador avisa antes de enviar si una foto no sirve.
    const entrada = d.getElementById('gmgChatFileInput');
    const elegir = archivos => {
        const dt = new DataTransfer();
        archivos.forEach(a => dt.items.add(a));
        entrada.files = dt.files;
        entrada.dispatchEvent(new Event('change', { bubbles: true }));
    };
    const vistas = () => d.querySelectorAll('.gmg-chat-preview-item').length;
    const aviso = () => d.getElementById('gmgChatAviso').textContent;
    r.acceptFotos = entrada.getAttribute('accept');
    elegir([new File(['GIF89a'], 'pieza.gif', { type: 'image/gif' })]);
    r.gifRechazado = vistas() === 0 && aviso().includes('JPG, PNG o WebP de hasta 4 MB');
    elegir([new File([new Uint8Array(4 * 1024 * 1024 + 1)], 'grande.jpg', { type: 'image/jpeg' })]);
    r.grandeRechazada = vistas() === 0;
    elegir([new File([new Uint8Array(2048)], 'pieza.png', { type: 'image/png' })]);
    r.pngAceptado = vistas() === 1;

    r.xss = window.__xss || 0;
    document.getElementById('resultado').textContent = JSON.stringify(r);
});
iframe.src = '/index.php';
</script>
</body>
</html>
