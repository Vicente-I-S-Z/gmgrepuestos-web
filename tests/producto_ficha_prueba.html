<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Prueba de la ficha de producto</title>
</head>
<body style="margin:0">
<!--
  Página de prueba de tests/producto_ficha_test.php (F2-4). Carga la ficha real en dos iframes
  (360 y 1366 px) y revisa: sin scroll horizontal, "Preguntar al asistente" abre el chat con la
  consulta escrita y "Añadir al carrito" agrega el producto. Uso: ?id=N. No se publica (tests/).
-->
<iframe id="angosto" title="Ficha a 360 px" style="width:360px;height:700px;border:0"></iframe>
<iframe id="ancho" title="Ficha a 1366 px" style="width:1366px;height:700px;border:0"></iframe>
<pre id="resultado">pendiente</pre>
<script>
localStorage.removeItem('gmg_cart');
const id = new URLSearchParams(location.search).get('id');
const esperar = ms => new Promise(r => setTimeout(r, ms));
const cargar = (iframe) => new Promise(r => { iframe.addEventListener('load', r, { once: true }); iframe.src = '/producto.php?id=' + id; });

(async () => {
    const r = {};
    const angosto = document.getElementById('angosto');
    const ancho = document.getElementById('ancho');
    await Promise.all([cargar(angosto), cargar(ancho)]);
    await esperar(800);

    for (const [nombre, iframe] of [['angosto', angosto], ['ancho', ancho]]) {
        const d = iframe.contentDocument;
        r[nombre + 'SinScroll'] = d.documentElement.scrollWidth <= iframe.clientWidth;
        r[nombre + 'Columnas'] = getComputedStyle(d.querySelector('.ficha-producto')).gridTemplateColumns.split(' ').length;
    }

    const d = angosto.contentDocument;
    const boton = d.querySelector('.ficha-btn-asistente');
    r.preguntaEsperada = boton.dataset.chatPregunta;
    boton.click();
    await esperar(300);
    r.chatAbierto = d.getElementById('gmgChatWindow').classList.contains('active');
    r.chatTexto = d.getElementById('gmgChatInput').value;
    r.chatFoco = d.activeElement === d.getElementById('gmgChatInput');
    const tamBoton = boton.getBoundingClientRect();
    r.botonAlto = Math.round(tamBoton.height);

    const agregar = d.querySelector('.btn-add-cart:not([disabled])');
    if (agregar) {
        agregar.click();
        const carrito = JSON.parse(localStorage.getItem('gmg_cart') || '[]');
        r.carrito = carrito.map(i => String(i.id) + 'x' + i.quantity);
    }
    document.getElementById('resultado').textContent = JSON.stringify(r);
})();
</script>
</body>
</html>
