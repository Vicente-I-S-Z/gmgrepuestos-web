<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Vista a un ancho fijo</title>
</head>
<body style="margin:0;background:#888">
<!--
  Muestra una página del sitio dentro de un iframe del ancho pedido, para revisar el diseño
  móvil con Edge o Chrome sin ventana (que no bajan de unos 500 px de ancho de ventana).
  Uso: /tests/vista_ancho.html?ancho=360&alto=1800&url=/index.php%3Fq%3Dfiltro
  Solo acepta rutas del mismo sitio. No se publica (tests/).
-->
<iframe id="vista" title="Vista" style="border:0;display:block;background:#fff"></iframe>
<script>
const p = new URLSearchParams(location.search);
const ruta = p.get('url') || '/';
const vista = document.getElementById('vista');
vista.style.width = (parseInt(p.get('ancho'), 10) || 360) + 'px';
vista.style.height = (parseInt(p.get('alto'), 10) || 1800) + 'px';
if (ruta.startsWith('/') && !ruta.startsWith('//')) {
    vista.src = ruta;
}
</script>
</body>
</html>
