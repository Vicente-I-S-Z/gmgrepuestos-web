<!doctype html>
<html lang="es-CL">
<head><meta charset="utf-8"><title>Prueba del aviso de reposición</title></head>
<body style="margin:0">
<!--
  Página de prueba de tests/aviso_stock_test.php (F3-11). Carga la ficha real de un repuesto sin
  stock (?id=N) y usa su formulario: contacto inválido y luego un correo válido. No se publica (tests/).
-->
<iframe id="sitio" style="width:1200px;height:700px;border:0"></iframe>
<pre id="resultado">pendiente</pre>
<script>
const id = new URLSearchParams(location.search).get('id');
const esperar = ms => new Promise(r => setTimeout(r, ms));
const iframe = document.getElementById('sitio');
iframe.addEventListener('load', async () => {
    await esperar(500);
    const d = iframe.contentDocument;
    const form = d.querySelector('form.aviso-stock');
    const r = { hayFormulario: !!form };
    if (form) {
        const input = form.querySelector('input');
        const msg = form.querySelector('.aviso-stock-msg');
        input.value = 'hola';
        form.querySelector('button').click();
        await esperar(300);
        r.invalido = msg.textContent;
        r.invalidoEsError = msg.classList.contains('is-error');
        input.value = 'Cliente.Prueba.F311@Example.com';
        form.querySelector('button').click();
        await esperar(1500);
        r.valido = msg.textContent;
        r.validoEsOk = msg.classList.contains('is-ok');
        r.inputBloqueado = input.disabled;
    }
    document.getElementById('resultado').textContent = JSON.stringify(r);
}, { once: true });
iframe.src = '/producto.php?id=' + id;
</script>
</body>
</html>
