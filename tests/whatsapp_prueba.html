<!doctype html>
<html lang="es-CL">
<head><meta charset="utf-8"><title>Prueba de WhatsApp</title></head>
<body style="margin:0">
<!--
  Página de prueba de tests/whatsapp_test.php (F3-6). Carga la tienda real en iframes y revisa los
  enlaces de WhatsApp: botón flotante según la página, resumen del chat y pedido del carrito.
  Uso: ?id=N (un repuesto con stock). No se publica (tests/).
-->
<iframe id="modelo" style="width:1200px;height:600px;border:0"></iframe>
<iframe id="ficha" style="width:1200px;height:600px;border:0"></iframe>
<pre id="resultado">pendiente</pre>
<script>
const id = new URLSearchParams(location.search).get('id');
const esperar = ms => new Promise(r => setTimeout(r, ms));
const cargar = (iframe, url) => new Promise(r => { iframe.addEventListener('load', r, { once: true }); iframe.src = url; });
const texto = href => decodeURIComponent((href.split('?text=')[1] || '').replace(/\+/g, ' '));
localStorage.removeItem('gmg_cart');
localStorage.setItem('gmg_chat_historial', JSON.stringify([
    { rol: 'user', texto: 'Necesito pastillas de freno para Swift 2019' },
    { rol: 'bot', texto: 'Encontré estas', productos: [{ id: 1, nombre: 'Pastillas delanteras Swift 3ª gen.', sku: 'FRE-SWI3-PDL' }] }
]));
(async () => {
    const r = {};
    const m = document.getElementById('modelo');
    const f = document.getElementById('ficha');
    await Promise.all([cargar(m, '/index.php?modelo=swift'), cargar(f, '/producto.php?id=' + id)]);
    await esperar(600);
    r.flotanteModelo = texto(m.contentDocument.getElementById('gmgWhatsappFlotante').href);
    r.flotanteFicha = texto(f.contentDocument.getElementById('gmgWhatsappFlotante').href);

    const d = f.contentDocument;
    const btnChat = d.getElementById('gmgChatWhatsapp');
    btnChat.addEventListener('click', e => e.preventDefault()); // no abrir la pestaña de WhatsApp
    btnChat.click();
    r.resumenChat = texto(btnChat.href);

    const btnCarrito = d.getElementById('btn-whatsapp-carrito');
    r.carritoVacioOculto = btnCarrito.hidden;
    d.querySelector('.ficha-acciones .btn-add-cart').click();
    d.querySelector('.ficha-acciones .btn-add-cart').click();
    await esperar(300);
    r.carritoVisible = !btnCarrito.hidden;
    r.pedidoCarrito = texto(btnCarrito.href);
    r.nombre = d.querySelector('h1').textContent.trim();
    r.precio = parseInt(d.querySelector('.ficha-acciones .btn-add-cart').dataset.precio, 10);
    r.numero = btnCarrito.href.split('?')[0];
    document.getElementById('resultado').textContent = JSON.stringify(r);
})();
</script>
</body>
</html>
