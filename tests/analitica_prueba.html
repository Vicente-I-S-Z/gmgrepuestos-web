<!doctype html>
<html lang="es-CL">
<head><meta charset="utf-8"><title>Prueba de Analytics</title></head>
<body style="margin:0">
<!-- Página de prueba de tests/analitica_test.php (F4-3). Carga una ficha real (?id=N) y revisa los eventos en dataLayer. No se publica. -->
<iframe id="sitio" style="width:1200px;height:700px;border:0"></iframe>
<pre id="resultado">pendiente</pre>
<script>
const esperar = ms => new Promise(r => setTimeout(r, ms));
const iframe = document.getElementById('sitio');
localStorage.removeItem('gmg_cart');
iframe.addEventListener('load', async () => {
    await esperar(700);
    const d = iframe.contentDocument, w = iframe.contentWindow;
    const eventos = () => (w.dataLayer || []).filter(x => x && x[0] === 'event').map(x => x[1]);
    const r = { hayGtag: typeof w.gtag === 'function' };
    d.querySelector('.ficha-acciones .btn-add-cart').click();
    d.getElementById('gmgChatToggle').click();
    const wa = d.getElementById('gmgWhatsappFlotante');
    wa.addEventListener('click', e => e.preventDefault());
    wa.click();
    d.getElementById('btn-checkout').click();
    await esperar(300);
    r.eventos = eventos();
    const vista = (w.dataLayer || []).find(x => x && x[1] === 'view_item');
    r.vistaItem = vista ? vista[2].items[0] : null;
    document.getElementById('resultado').textContent = JSON.stringify(r);
}, { once: true });
iframe.src = '/producto.php?id=' + new URLSearchParams(location.search).get('id');
</script>
</body>
</html>
