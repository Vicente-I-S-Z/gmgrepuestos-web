<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Prueba de la paginación a 360 px</title>
</head>
<body style="margin:0">
<!--
  Página de prueba de tests/paginacion_test.php (F2-6). Carga la página 3 del Swift en un iframe
  de 360 px y revisa que no haya scroll horizontal y que los botones midan 44 x 44 px o más.
  No se publica (tests/).
-->
<iframe id="sitio" title="Listado" style="width:360px;height:700px;border:0" src="/index.php?modelo=swift&pagina=3"></iframe>
<pre id="resultado">pendiente</pre>
<script>
const iframe = document.getElementById('sitio');
iframe.addEventListener('load', () => setTimeout(() => {
    const d = iframe.contentDocument;
    const botones = [...d.querySelectorAll('.paginacion a, .paginacion span[aria-current]')].map(b => b.getBoundingClientRect());
    document.getElementById('resultado').textContent = JSON.stringify({
        sinScroll: d.documentElement.scrollWidth <= iframe.clientWidth,
        botones: botones.length,
        menorAlto: Math.round(Math.min(...botones.map(b => b.height))),
        menorAncho: Math.round(Math.min(...botones.map(b => b.width)))
    });
}, 600));
</script>
</body>
</html>
